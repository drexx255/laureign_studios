# Netlify Configuration for Laureign Studios Packages
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/packages/index.html"
  status = 302
  force = false

[[redirects]]
  from = "/packages"
  to = "/packages/index.html"
  status = 302
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
